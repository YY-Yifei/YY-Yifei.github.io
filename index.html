<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YY-Yifei · GitHub Pages</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px;
    }
    h1 { font-size: 32px; margin-bottom: 8px; }
    .subtitle { color: #94a3b8; margin-bottom: 40px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 900px;
    }
    .card {
      background: #334155;
      border-radius: 14px;
      padding: 24px;
      text-decoration: none;
      color: #e2e8f0;
      border: 1px solid #475569;
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
      border-color: #38bdf8;
    }
    .card .emoji { font-size: 36px; margin-bottom: 12px; display: block; }
    .card h2 { font-size: 18px; margin-bottom: 6px; }
    .card p { font-size: 13px; color: #cbd5e1; line-height: 1.6; }
    .card .tag {
      display: inline-block;
      font-size: 11px;
      background: #0ea5e9;
      color: #fff;
      border-radius: 10px;
      padding: 2px 10px;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <h1>🗂️ YY-Yifei 站点导航</h1>
  <p class="subtitle">GitHub Pages 托管 · 各子系统独立子目录</p>

  <div class="grid">
    <a class="card" href="atlas/">
      <span class="emoji">🗺️</span>
      <h2>Atlas 地图标记系统</h2>
      <p>场景化地图节点标注。对话生成 JSON 数据，直观展示铁路、地铁等场景的核心节点与连线。</p>
      <span class="tag">进入 →</span>
    </a>
    <!-- 未来的子系统在这里添加卡片 -->
  </div>
</body>
</html>
